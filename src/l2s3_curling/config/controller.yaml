curling_controller:
  ros__parameters:
    target_run: 0                 # 1..5: fixed curling target; 0: legacy goal_distance mission.
    decision_log_dir: run_logs/avoidance_decisions  # Relative to the rover workspace at launch.
    goal_distance: 5.0
    speed: 0.5                    # Cruise ceiling in m/s; braking and coverage can reduce the command.
    avoidance_speed: 0.2
    angular_speed: 0.8
    half_length: 0.125             # Chassis footprint, metres, including tyres.
    half_width: 0.11
    side_margin: 0.06
    stop_clearance: 0.05          # Front bumper to obstacle.
    emergency_clearance: 0.03
    sidestep_min: 0.50
    sidestep_max: 1.00
    bypass_angle_margin_deg: 5.0  # Extra angle beyond the first clear diagonal.
    bypass_max_distance: 2.20     # Maximum length of a diagonal; goal progress caps it further.
    rejoin_check_distance: 1.0    # Check this far toward the goal, or up to the goal.
    rejoin_clear_time: 0.2        # Turn and corridor must remain clear for this long.
    occupied_goal_radius_m: 0.35  # A route blocker this close to the goal counts as occupying it.
    occupied_goal_clearance_m: 0.10 # Stop this far before an occupied goal, measured from the front bumper.
    braking_deceleration: 0.5     # Command ramp assumption, not measured physical braking.
    linear_acceleration: 0.5
    angular_acceleration: 1.2
    reaction_time: 0.20           # Added to measured scan age when calculating braking distance.
    heading_tolerance: 0.04       # Radians, about 2.3 degrees.
    distance_tolerance: 0.035
    goal_tolerance_m: 0.08        # Finish from any active state when the validated FUSED pose is this close.
    settle_time: 0.25
    minimum_coverage: 0.65
    mission_timeout: 600.0        # Overall mission deadline; arrival and faults can end the run earlier.
    gap_lookahead: 1.5            # Look for a gap between two obstacles once one is this close ahead.
    gap_max_angle: 0.70           # Radians (40 degrees); furthest the gap entry may be off the route.
    gap_max_offset: 0.80          # Furthest sideways the gap may be from the route.
    gap_runup: 0.30               # Straight run-up in front of the gap, after lining up.
    gap_exit: 0.50                # Drive this far beyond the obstacles before rejoining.
    gap_side_window: 0.60         # Obstacles must lie within this distance on both sides.
    obstacle_length: 0.50         # Longest obstacle the drive through must clear.
    gap_margin: 0.02              # Room each side in a gap; smallest gap 2 * (half_width + gap_margin) = 0.26 m.
    input_timeout: 1.5            # LiDAR, gyro and odometry age/receipt allowance.
    scan_memory_s: 0.30
    control_rate: 20.0
    resume_clear_time: 0.2
    scan_topic: /scan
    odom_topic: /odom/wheels      # Run 10c: fused /odom under-reported distance by ~35% on turf; wheels matched LiDAR within ~5%.
    # Required for goal steering and arrival; bypass distances still use wheel/gyro motion.
    ekf_pose_topic: /marker_ekf/pose
    ekf_frame: map
    ekf_timeout: 1.0             # Maximum acquisition/receipt age, including the last matched alignment.
    # Standard-deviation thresholds for advisory warnings.
    max_position_std_m: 0.80     # Largest position standard deviation in any horizontal direction.
    max_heading_std_deg: 30.0
    # One camera-only relocalization on the final approach.
    relocalize_distance_m: 1.0
    relocalize_position_std_m: 0.20
    relocalize_heading_std_deg: 8.0
    relocalize_marker_age_s: 1.5  # Look back for two distinct accepted tags.
    relocalize_duration_s: 8.0
    imu_topic: /imu/estimation
    base_frame: base_footprint
    command_topic: /curling_controller/cmd_vel
