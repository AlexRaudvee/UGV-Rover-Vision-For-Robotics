/**:
  ros__parameters:
    # USB pan-tilt camera. Use /image_rect for the rectified stream, or a topic
    # ending in /compressed (e.g. /oak/rgb/image_rect/compressed) for JPEG input.
    image_topic: /image_raw
    # baseline | clahe | sharpen | upscale | tuned | undistort | improved
    # Change while running: ros2 param set /marker_detector preset baseline
    preset: improved
    # Marker categories to detect (OpenCV dictionary names without DICT_).
    # Keep only the families used in the lab: each one is an extra detector pass.
    families: [APRILTAG_36h11, APRILTAG_25h9, 4X4_50, 5X5_100, 6X6_250]
    max_rate: 10.0
    capture_dir: /home/ws/ugv_ws/runs/marker_captures
    # Set before each capture, e.g. d1.0m_a30deg
    capture_label: ''
