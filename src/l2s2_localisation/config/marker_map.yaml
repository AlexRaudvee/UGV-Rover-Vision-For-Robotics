# Known field positions (metres), checked with the Zamo on 18 Nov 2026.
# Tags 1-5 stand along the field edge; tag 0 is on the middle line,
# 0.55 m behind the centre spot (2.67 m in front of the start at x = -3.25).
# Frame (assignment Table 2 / Fig. 7): origin at the centre spot, x towards the
# goal with the curling targets, y to the left.
# The live range overlay reloads this source map automatically. A standalone
# scanner using the installed copy needs a rebuild, or marker_map_file set here.
field:
  half_length: 4.5
  half_width: 3.0
  border: 0.4
markers:
  # Standing on the centre spot facing the target goal: tags 2 and 4 on the
  # left, tags 1 and 3 on the right, tag 5 ahead in the goal.
  APRILTAG_standard41h12:0: [-0.55, 0.0]
  APRILTAG_standard41h12:1: [-1.5, -3.0]
  APRILTAG_standard41h12:2: [-1.5, 3.0]
  APRILTAG_standard41h12:3: [1.55, -3.0]
  APRILTAG_standard41h12:4: [1.55, 3.0]
  APRILTAG_standard41h12:5: [4.5, 0.0]
